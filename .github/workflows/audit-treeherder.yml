name: Audit Treeherder configuration

on:
  schedule:
    - cron: '23 8 * * 1-5'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  configured-series:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run audit:live
